[package]
name = "simplecrawl-core"
version = "0.1.0"
description = "Core library for simplecrawl, a small feed-to-Markdown archiver"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dom_smoothie = "0.18"
encoding_rs = "0.8"
feed-rs = "3"
futures = "0.3"
hex = "0.4"
jiff = "0.2"
minijinja = { version = "3", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
toml = "0.9"
url = "2"

[dev-dependencies]
httpmock = "0.9"
tempfile = "3"

[lints]
workspace = true
